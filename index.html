<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a64d2e">
  <meta name="robots" content="noindex">
  <title>Opening Rajasthan Routes…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4eee3;color:#24221e;font:16px/1.5 system-ui,sans-serif}
    main{width:min(520px,calc(100% - 36px));padding:28px;background:#fffdf8;border:1px solid #ded2bf;border-radius:18px}
    h1{font:2rem Georgia,serif;margin:0 0 8px}
    p{color:#736c61}
    a{display:inline-block;margin-top:8px;background:#a64d2e;color:white;text-decoration:none;font-weight:700;padding:10px 15px;border-radius:999px}
  </style>
  <script>
    (function () {
      var base = window.location.pathname.replace(/index[.]html$/i, "");
      if (!base.endsWith("/")) base += "/";
      var target = base + "site/" + window.location.search + window.location.hash;
      var fallback = document.getElementById("appLink");
      if (fallback) fallback.href = target;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <h1>Rajasthan Routes</h1>
    <p>Opening the travel planner. If automatic redirection is blocked, use the button below.</p>
    <a id="appLink" href="./site/">Open the travel planner</a>
  </main>
</body>
</html>
